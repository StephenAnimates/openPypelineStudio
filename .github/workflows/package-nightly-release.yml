name: Package Nightly Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag of the existing nightly release (for example, v2.0.0-nightly-20261111)
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    if: contains(github.event.release.tag_name || inputs.release_tag, '-nightly-')
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Create ZIP archive
        id: archive
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-nightly-[0-9]{8}$ ]]; then
            echo "Unexpected nightly release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          archive="openPypelineStudio.zip"
          git archive --format=zip --prefix=openPypelineStudio/ "$RELEASE_TAG" > "$archive"
          echo "path=$archive" >> "$GITHUB_OUTPUT"

      - name: Attach ZIP to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          ARCHIVE_PATH: ${{ steps.archive.outputs.path }}
        run: gh release upload "$RELEASE_TAG" "$ARCHIVE_PATH" --clobber --repo "$GITHUB_REPOSITORY"
