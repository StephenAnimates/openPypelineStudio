name: Package Nightly Release

on:
  schedule:
    # Runs every night at 08:00 UTC (midnight PST)
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      version_prefix:
        description: Base version prefix (for example, v2.0.0)
        required: true
        default: "v2.0.0"
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create ZIP archive and release notes
        id: archive
        env:
          BASE_VERSION: ${{ inputs.version_prefix || 'v2.0.0' }}
        run: |
          RELEASE_TAG="${BASE_VERSION}-nightly-$(date -u +%Y%m%d)"
          archive="openPypelineStudio.zip"
          git archive --format=zip --prefix=openPypelineStudio/ HEAD > "$archive"

          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          {
            echo "Automated nightly build from \`${GITHUB_SHA:0:7}\`."
            echo ""
            echo "### Changes"
            if [ -n "$PREV_TAG" ]; then
              CHANGES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"* %s (%h) — %an")
              if [ -z "$CHANGES" ]; then
                echo "* No new commits since $PREV_TAG."
              else
                echo "$CHANGES"
              fi
            else
              git log -n 15 --pretty=format:"* %s (%h) — %an"
            fi
          } > release_notes.md

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "path=$archive" >> "$GITHUB_OUTPUT"

      - name: Create or update nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.archive.outputs.tag }}
          ARCHIVE_PATH: ${{ steps.archive.outputs.path }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ARCHIVE_PATH" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --notes-file release_notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$ARCHIVE_PATH" \
              --title "Nightly Build ($RELEASE_TAG)" \
              --notes-file release_notes.md \
              --prerelease \
              --target "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY"
          fi
